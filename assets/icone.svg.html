<!--
  icone.svg — sprite che sostituisce tutte le emoji del sito.

  USO
  1. Incolla questo blocco subito dopo <body> (è già display:none).
     Oppure servilo come file e usa <use href="/assets/icone.svg#ti-cloze">.
  2. Sostituisci ogni emoji con:
       <svg class="ti-ico" aria-hidden="true"><use href="#ti-cloze"></use></svg>
  3. Se l'icona è l'unica cosa che veicola il significato, aggiungi
     un'etichetta testuale visibile o <span class="sr-only">Cloze</span>.
     Mai lasciare l'icona da sola senza testo.

  MAPPATURA emoji → icona (indice esercizi)
    📝 → ti-cloze          ✅ → ti-quiz           ✔️ → ti-vero-falso
    🃏 → ti-carte          🧩 → ti-incastro       🔎 → ti-lente
    🔤 → ti-lettere        🗂️ → ti-categorie      🚫 → ti-intruso
    🎪 → ti-impiccato      ⭕ → ti-tris           🚢 → ti-battaglia
    🎡 → ti-ruota          🎧 → ti-audio          🎲 → ti-dado
    👂 → ti-ascolto        📄 → ti-documento      ⏱️ → ti-cronometro
    🔍 → ti-confronto      🔗 → ti-collega        💬 → ti-dialogo
    🎒 🗒️ → ti-banca-parole                       📶 → ti-livelli
    🕐 → ti-ordine
  Le emoji puramente decorative (🎨 🐾 🥑 💡 🎯 🇮🇹 🗳️ 🏘️ 🌍 …) vanno
  eliminate senza sostituzione: l'icona di tipo basta già.

  ALTROVE
    ★★★★★ → ti-stella (ripetuta 5 volte, con aria-label sul contenitore)
    ✓ elenchi app-ti → ti-check
    🎓 🏛️ 💬 💼 🧸 home → ti-laurea, ti-cultura, ti-conversazione,
                            ti-lavoro, ti-bambini
    Bandiere recensioni 🇵🇪 🇬🇧 … → RESTANO COSÌ. Sono l'unica eccezione:
    le emoji delle recensioni non vanno sostituite. (Se un giorno cambiassi
    idea, in recensioni.json ci sono i campi "paese_nl" e "paese_it".)
-->

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.6;
               stroke-linecap: round; stroke-linejoin: round; }
      symbol .solido { fill: currentColor; stroke: none; }
    </style>
  </defs>

  <!-- cloze: riga di testo con uno spazio da riempire -->
  <symbol id="ti-cloze" viewBox="0 0 24 24">
    <path d="M3 7h7M14 7h7M3 12h4M17 12h4"/>
    <rect x="8.5" y="9.5" width="7" height="5" rx="1"/>
    <path d="M3 17h12"/>
  </symbol>

  <!-- quiz: opzione selezionata -->
  <symbol id="ti-quiz" viewBox="0 0 24 24">
    <circle cx="6" cy="7" r="2.5"/>
    <circle cx="6" cy="16.5" r="2.5"/>
    <circle cx="6" cy="16.5" r="1" class="solido"/>
    <path d="M11.5 7h9M11.5 16.5h9"/>
  </symbol>

  <!-- vero/falso -->
  <symbol id="ti-vero-falso" viewBox="0 0 24 24">
    <path d="M3 8.5l2.2 2.2L9.5 6.4"/>
    <path d="M13.5 6.5l6 6M19.5 6.5l-6 6"/>
    <path d="M3 18h18"/>
  </symbol>

  <!-- carte / abbinamento / flashcard -->
  <symbol id="ti-carte" viewBox="0 0 24 24">
    <rect x="3" y="6" width="9" height="13" rx="1.5"/>
    <rect x="12.5" y="4" width="8.5" height="13" rx="1.5" transform="rotate(9 16.75 10.5)"/>
  </symbol>

  <!-- cruciverba / riordina: incastro -->
  <symbol id="ti-incastro" viewBox="0 0 24 24">
    <rect x="3" y="3" width="8" height="8" rx="1"/>
    <rect x="13" y="13" width="8" height="8" rx="1"/>
    <path d="M11 7h5a2 2 0 012 2v4"/>
  </symbol>

  <!-- crucipuzzle / trova: lente su griglia -->
  <symbol id="ti-lente" viewBox="0 0 24 24">
    <path d="M4 4h9M4 8h9M4 12h5M4 16h5"/>
    <circle cx="15" cy="15" r="4.5"/>
    <path d="M18.4 18.4L21.5 21.5"/>
  </symbol>

  <!-- anagramma: lettere mescolate -->
  <symbol id="ti-lettere" viewBox="0 0 24 24">
    <rect x="3" y="3.5" width="7" height="7" rx="1"/>
    <rect x="14" y="6.5" width="7" height="7" rx="1"/>
    <rect x="7" y="14" width="7" height="7" rx="1"/>
    <path d="M10.5 7.5h3"/>
  </symbol>

  <!-- categorizza: due colonne -->
  <symbol id="ti-categorie" viewBox="0 0 24 24">
    <rect x="3" y="4" width="7.5" height="16" rx="1.5"/>
    <rect x="13.5" y="4" width="7.5" height="16" rx="1.5"/>
    <path d="M5.5 8.5h2.5M16 8.5h2.5M5.5 12h2.5M16 12h2.5"/>
  </symbol>

  <!-- intruso: tre uguali e uno diverso -->
  <symbol id="ti-intruso" viewBox="0 0 24 24">
    <circle cx="6" cy="6" r="2.6"/>
    <circle cx="18" cy="6" r="2.6"/>
    <circle cx="6" cy="18" r="2.6"/>
    <path d="M15.4 15.4l5.2 5.2M20.6 15.4l-5.2 5.2"/>
  </symbol>

  <!-- impiccato: lettere con trattini -->
  <symbol id="ti-impiccato" viewBox="0 0 24 24">
    <path d="M4 19h4M10 19h4M16 19h4"/>
    <path d="M6 14V9M12 14V6M18 14v-3"/>
    <circle cx="12" cy="4" r="1.4" class="solido"/>
  </symbol>

  <!-- tris -->
  <symbol id="ti-tris" viewBox="0 0 24 24">
    <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
    <circle cx="6" cy="6" r="1.8"/>
    <path d="M16.7 16.7l4.6 4.6M21.3 16.7l-4.6 4.6"/>
  </symbol>

  <!-- battaglia navale -->
  <symbol id="ti-battaglia" viewBox="0 0 24 24">
    <path d="M3 4h18M3 9h18M3 14h18M3 19h18"/>
    <path d="M8 3v18M13 3v18M18 3v18"/>
    <circle cx="10.5" cy="11.5" r="1.6" class="solido"/>
  </symbol>

  <!-- ruota -->
  <symbol id="ti-ruota" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18"/>
    <circle cx="12" cy="12" r="1.4" class="solido"/>
  </symbol>

  <!-- audio / dettato -->
  <symbol id="ti-audio" viewBox="0 0 24 24">
    <path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>
  </symbol>

  <!-- dado -->
  <symbol id="ti-dado" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.3" class="solido"/>
    <circle cx="15.5" cy="15.5" r="1.3" class="solido"/>
    <circle cx="12" cy="12" r="1.3" class="solido"/>
  </symbol>

  <!-- ascolto / coppie minime -->
  <symbol id="ti-ascolto" viewBox="0 0 24 24">
    <path d="M7 9a5 5 0 0110 0c0 3-2 4-2 6.5a2.5 2.5 0 01-5 0"/>
    <path d="M11 9a1.5 1.5 0 013 0"/>
    <path d="M8 20.5c1-1 1.5-2 1.5-3.5"/>
  </symbol>

  <!-- documento / paragrafi -->
  <symbol id="ti-documento" viewBox="0 0 24 24">
    <path d="M6 3h8l4 4v14H6z"/>
    <path d="M14 3v4h4"/>
    <path d="M9 12h6M9 16h6"/>
  </symbol>

  <!-- cronometro -->
  <symbol id="ti-cronometro" viewBox="0 0 24 24">
    <circle cx="12" cy="13.5" r="7.5"/>
    <path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6"/>
  </symbol>

  <!-- confronto / trova differenze -->
  <symbol id="ti-confronto" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="8" height="14" rx="1.5"/>
    <rect x="13.5" y="5" width="8" height="14" rx="1.5"/>
    <path d="M4.5 9h4M15.5 9h4M4.5 12.5h4M15.5 12.5h2"/>
  </symbol>

  <!-- collega / unisci frasi -->
  <symbol id="ti-collega" viewBox="0 0 24 24">
    <path d="M9.5 14.5l5-5"/>
    <path d="M13 6.5l1.5-1.5a3.5 3.5 0 015 5L18 11.5"/>
    <path d="M11 17.5L9.5 19a3.5 3.5 0 01-5-5L6 12.5"/>
  </symbol>

  <!-- dialogo -->
  <symbol id="ti-dialogo" viewBox="0 0 24 24">
    <path d="M3 5h12v8H8l-5 4z"/>
    <path d="M18 9h3v8l-3-2h-5v-2"/>
  </symbol>

  <!-- banca di parole -->
  <symbol id="ti-banca-parole" viewBox="0 0 24 24">
    <rect x="3" y="6" width="18" height="13" rx="2"/>
    <path d="M9 6V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V6"/>
    <path d="M7 11h4M13 11h4M7 15h10"/>
  </symbol>

  <!-- livelli / progressivo -->
  <symbol id="ti-livelli" viewBox="0 0 24 24">
    <path d="M4 20v-4M10 20v-8M16 20v-12M22 20V4" stroke-width="2.2"/>
  </symbol>

  <!-- ordine cronologico -->
  <symbol id="ti-ordine" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </symbol>

  <!-- stella (rating) -->
  <symbol id="ti-stella" viewBox="0 0 24 24">
    <path class="solido" d="M12 2.5l2.9 5.9 6.6.95-4.75 4.63 1.12 6.52L12 17.42l-5.87 3.08 1.12-6.52L2.5 9.35l6.6-.95z"/>
  </symbol>

  <!-- check elenchi -->
  <symbol id="ti-check" viewBox="0 0 24 24">
    <path d="M4 12.5l5 5L20 6.5" stroke-width="2.2"/>
  </symbol>

  <!-- home: percorsi di lezione -->
  <symbol id="ti-cultura" viewBox="0 0 24 24">
    <path d="M3 20h18M4.5 20V9.5M9.5 20V9.5M14.5 20V9.5M19.5 20V9.5"/>
    <path d="M2.5 9.5L12 3.5l9.5 6"/>
  </symbol>

  <symbol id="ti-conversazione" viewBox="0 0 24 24">
    <path d="M3.5 5.5h17v10h-9l-5 4v-4h-3z"/>
    <path d="M8 10h1M11.5 10h1M15 10h1"/>
  </symbol>

  <symbol id="ti-lavoro" viewBox="0 0 24 24">
    <rect x="2.5" y="7" width="19" height="13" rx="2"/>
    <path d="M8.5 7V5a1.5 1.5 0 011.5-1.5h4A1.5 1.5 0 0115.5 5v2"/>
    <path d="M2.5 12.5h19"/>
  </symbol>

  <symbol id="ti-bambini" viewBox="0 0 24 24">
    <circle cx="12" cy="9" r="5"/>
    <path d="M8.5 4.5C7 3 5.5 3.5 5.5 5.5S7 8 8.5 7"/>
    <path d="M15.5 4.5C17 3 18.5 3.5 18.5 5.5S17 8 15.5 7"/>
    <path d="M10 9.5h.01M14 9.5h.01"/>
    <path d="M5 21c1.5-4 4-6 7-6s5.5 2 7 6"/>
  </symbol>

  <symbol id="ti-laurea" viewBox="0 0 24 24">
    <path d="M2 8.5L12 4l10 4.5-10 4.5z"/>
    <path d="M6.5 11v5c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5v-5"/>
    <path d="M21 9v5"/>
  </symbol>
</svg>


<!-- CSS minimo per le icone -->
<style>
.ti-ico {
  width: 1.15em;
  height: 1.15em;
  vertical-align: -.18em;
  flex: none;
}
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
/* stelle: il contenitore porta aria-label="5 stelle su 5" */
.ti-stelle { display: inline-flex; gap: .1em; color: #e8a33d; }
</style>
